stages:
  data_ingestion:
    cmd: 'python "ML pipelines with DVC/src/data_ingestion.py"'
    deps:
      - ML pipelines with DVC/src/data_ingestion.py
    outs:
      - data/raw

  data_preprocessing:
    cmd: 'python "ML pipelines with DVC/src/data_preprocessing.py"'
    deps:
      - data/raw
      - ML pipelines with DVC/src/data_preprocessing.py
    outs:
      - data/processed

  feature_engineering:
    cmd: 'python "ML pipelines with DVC/src/feature_engineering.py"'
    deps:
      - data/processed
      - ML pipelines with DVC/src/feature_engineering.py
    outs:
      - data/features

  model_building:
    cmd: 'python "ML pipelines with DVC/src/model_building.py"'
    deps:
      - data/features
      - ML pipelines with DVC/src/model_building.py
    outs:
      - model.pkl

  model_evaluation:
    cmd: 'python "ML pipelines with DVC/src/model_evaluation.py"'
    deps:
      - model.pkl
      - ML pipelines with DVC/src/model_evaluation.py
    metrics:
      - metrics.json